app = "mirolagente"
primary_region = "dfw"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[checks]
  [checks.health]
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/api/health"
